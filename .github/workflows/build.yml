name: 构建安装包

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PyMuPDF python-docx Pillow ezdxf matplotlib

      - name: 验证依赖
        shell: pwsh
        run: |
          python -c "import fitz; print('PyMuPDF OK')"
          python -c "from docx import Document; print('python-docx OK')"
          python -c "from PIL import Image; print('Pillow OK')"
          python -c "import ezdxf; print('ezdxf OK')"
          python -c "import matplotlib; print('matplotlib OK')"

      - name: 下载标准数据库
        shell: pwsh
        run: |
          $GZ_URL="https://github.com/luoda2023/LDAssistant/releases/download/data-v1/standards_gov_full.db.gz"
          $DB_FILE="standards_gov_full.db"
          $GZ_FILE="standards_gov_full.db.gz"
          Write-Host "下载数据库..."
          curl -L -o $GZ_FILE $GZ_URL
          Write-Host "解压..."
          7z x $GZ_FILE -y
          Write-Host "数据库大小: $((Get-Item $DB_FILE).Length / 1MB) MB"

      - name: 构建可执行文件 (onedir 模式，更快启动)
        shell: pwsh
        run: |
          python -m PyInstaller --onedir --windowed --name "LDAssistant" `
            --add-data "standards_gov_full.db;." `
            --add-data "app_icon.ico;." `
            --hidden-import "docx" `
            --hidden-import "ezdxf" `
            --hidden-import "matplotlib" `
            --hidden-import "PIL._tkinter_finder" `
            --exclude-module "matplotlib.tests" `
            --exclude-module "numpy.testing" `
            standard_checker_v2.py

      - name: 压缩 build 产物
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\LDAssistant\*" -DestinationPath "dist\LDAssistant.zip" -Force
          Write-Host "压缩完成: $((Get-Item 'dist\LDAssistant.zip').Length / 1MB) MB"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LDAssistant
          path: dist/LDAssistant.zip