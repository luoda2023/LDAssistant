name: 构建安装包

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab py7zr
          pip install PyMuPDF python-docx Pillow openpyxl ezdxf matplotlib

      - name: 验证依赖
        shell: pwsh
        run: |
          python -c "import fitz; print('PyMuPDF OK')"
          python -c "from docx import Document; print('python-docx OK')"
          python -c "from PIL import Image; print('Pillow OK')"
          python -c "import openpyxl; print('openpyxl OK')"
          python -c "import ezdxf; print('ezdxf OK')"
          python -c "import matplotlib; print('matplotlib OK')"
          python -c "import pyparsing; print('pyparsing OK')"

      - name: 解压标准数据库
        shell: pwsh
        run: python decompress_data.py

      - name: 转换标准数据库为 SQLite 格式
        shell: pwsh
        run: |
          python convert_json_to_db.py

      - name: 下载 OCR 引擎 (PaddleOCR-json)
        shell: pwsh
        run: |
          python download_ocr.py

      - name: 构建可执行文件 (onedir 模式)
        shell: pwsh
        run: |
          python -m PyInstaller --onedir --windowed --name "LDAssistant" `
            --icon "app_icon.ico" `
            --add-data "standards.db;." `
            --add-data "ocr;ocr" `
            --add-data "app_icon.ico;." `
            --add-data "app_icon.png;." `
            --hidden-import "standard_db" `
            --hidden-import "unittest" `
            --hidden-import "pyparsing" `
            --collect-all "fitz" `
            --collect-all "PIL" `
            --collect-all "docx" `
            --collect-all "ezdxf" `
            --collect-all "matplotlib" `
            --collect-all "reportlab" `
            --collect-all "pyparsing" `
            --exclude-module "matplotlib.tests" `
            --exclude-module "numpy.testing" `
            --exclude-module "numpy.f2py" `
            --exclude-module "numpy.distutils" `
            --exclude-module "PIL.ImageShow" `
            --exclude-module "PIL.ImageGrab" `
            --exclude-module "PIL.ImageCms" `
            --exclude-module "tkinter.test" `
            --exclude-module "test" `
            --exclude-module "tests" `
            --exclude-module "pytest" `
            --exclude-module "_pytest" `
            --exclude-module "setuptools" `
            --exclude-module "pip" `
            --exclude-module "wheel" `
            --exclude-module "pkg_resources" `
            --exclude-module "pydoc_data" `
            --exclude-module "IPython" `
            --exclude-module "jupyter" `
            --exclude-module "matplotlib.backends.backend_qt5agg" `
            --exclude-module "matplotlib.backends.backend_qt" `
            --exclude-module "matplotlib.backends.backend_wx" `
            standard_checker_v2.py

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          Write-Host "=== 用 choco 安装 Inno Setup ==="
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          Write-Host "ISCC exists: $(Test-Path $iscc)"
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem "C:\Program Files*" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName; Write-Host "Found ISCC: $iscc" } else { throw "ISCC.exe not found" }
          }
          echo "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ISCC_PATH=$iscc"

      - name: 检查 ISS 依赖
        shell: pwsh
        run: |
          Write-Host "app_icon.ico exists: $(Test-Path app_icon.ico)"
          Write-Host "dist/LDAssistant exists: $(Test-Path dist/LDAssistant)"
          Write-Host "LDAssistant.iss exists: $(Test-Path LDAssistant.iss)"
          if (Test-Path dist/LDAssistant) {
            Write-Host "dist/LDAssistant 内容:"
            Get-ChildItem dist/LDAssistant | Format-Table Name, Length
          } else {
            Write-Host "ERROR: dist/LDAssistant 不存在!"
            Write-Host "dist 目录内容:"
            if (Test-Path dist) {
              Get-ChildItem dist | Format-Table Name, Length
            }
          }

      - name: ISCC 编译安装包
        continue-on-error: true
        id: iscc
        shell: pwsh
        run: |
          $iscc = $env:ISCC_PATH
          Write-Host "ISCC: $iscc"
          $match = Select-String -Path "standard_checker_v2.py" -Pattern 'VERSION\s*=\s*"([\w.]+)"'
          if (-not $match) { throw "VERSION not found" }
          $version = $match.Matches.Groups[1].Value
          Write-Host "版本号: $version"
          Write-Host "=== ISCC 编译开始 ==="
          & $iscc /DAppVersion="$version" LDAssistant.iss 2>&1
          $isccExit = $LASTEXITCODE
          Write-Host "ISCC 退出码: $isccExit"
          if ($isccExit -eq 0) {
            Write-Host "=== ISCC 编译成功 ==="
            echo "iscc_success=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "::warning::ISCC 编译失败 (exit $isccExit)，使用 zip 回退方案"
            echo "iscc_success=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: 打包 PyInstaller onedir 为 zip（备用方案）
        if: steps.iscc.outputs.iscc_success != 'true'
        shell: pwsh
        run: |
          Write-Host "=== ISCC 失败，打包 onedir 为 zip ==="
          $match = Select-String -Path "standard_checker_v2.py" -Pattern 'VERSION\s*=\s*"([\w.]+)"'
          if (-not $match) { $version = "0.0.0" } else { $version = $match.Matches.Groups[1].Value }
          $zipName = "LDAssistant-v$version.zip"
          Compress-Archive -Path "dist/LDAssistant/*" -DestinationPath "dist/$zipName" -Force
          Write-Host "已创建: dist/$zipName"
          Get-ChildItem "dist/$zipName" | Format-Table Name, Length

      - name: 上传构建产物为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDAssistant-build
          path: |
            dist/LDAssistant-Setup-*.exe
            dist/LDAssistant-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: 列出构建产物
        shell: pwsh
        run: |
          Write-Host "=== dist 目录内容 ==="
          if (Test-Path dist) {
            Get-ChildItem dist | Format-Table Name, Length, FullName
          } else {
            Write-Host "dist 目录不存在!"
          }

      - name: 上传到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY

          # 查找要上传的文件（优先 Setup exe，其次 zip）
          $uploadFiles = @()
          $setupFiles = Get-ChildItem dist -Filter "LDAssistant-Setup-*.exe" -ErrorAction SilentlyContinue
          if ($setupFiles) {
            $uploadFiles += $setupFiles
            Write-Host "找到 ISCC 安装包:"
          } else {
            $zipFiles = Get-ChildItem dist -Filter "LDAssistant-*.zip" -ErrorAction SilentlyContinue
            if ($zipFiles) {
              $uploadFiles += $zipFiles
              Write-Host "找到 zip 包（ISCC 编译失败，使用备用方案）:"
            } else {
              Write-Host "ERROR: 未找到任何可上传的文件"
              exit 1
            }
          }
          $uploadFiles | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

          # 使用 gh CLI 原子化创建/更新 Release（避免删除-创建竞态）
          $tagName = "latest-build"
          $releaseBody = "自动构建最新版工程助手`ncommit: $($env:GITHUB_SHA.Substring(0,7))"

          # 先删除旧 tag
          Write-Host "=== 删除旧 Release ==="
          $apiUrl = "https://api.github.com/repos/$repo/releases"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          try {
            $existing = Invoke-RestMethod -Uri "$apiUrl/tags/$tagName" -Headers $headers
            if ($existing) {
              Write-Host "删除旧 Release (id=$($existing.id))..."
              Invoke-RestMethod -Uri "$apiUrl/$($existing.id)" -Method DELETE -Headers $headers | Out-Null
            }
          } catch {
            Write-Host "无旧 Release 需要删除"
          }

          # 创建新 Release
          Write-Host "=== 创建新 Release ==="
          $body = @{
            tag_name = $tagName
            name = "LDAssistant 最新构建"
            body = $releaseBody
            draft = $false
            prerelease = $false
            target_commitish = $env:GITHUB_SHA
          } | ConvertTo-Json -Depth 5

          try {
            $release = Invoke-RestMethod -Uri $apiUrl -Method POST -Headers $headers -Body $body -ContentType "application/json; charset=utf-8"
            Write-Host "Release 创建成功: id=$($release.id)"
          } catch {
            Write-Host "ERROR: 创建 Release 失败: $_"
            Write-Host "StatusCode: $($_.Exception.Response.StatusCode.value__)"
            try {
              $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
              $errorResponse = $reader.ReadToEnd()
              Write-Host "Response: $errorResponse"
            } catch {}
            exit 1
          }

          # 上传文件到 Release
          Write-Host "=== 上传文件 ==="
          foreach ($file in $uploadFiles) {
            $fileName = $file.Name
            $uploadUrl = $release.upload_url -replace '\{\?name,label\}', "?name=$fileName"
            Write-Host "上传 $fileName ..."
            $maxRetries = 3
            $uploaded = $false
            for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
              try {
                $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
                Invoke-RestMethod -Uri $uploadUrl -Method POST -Headers $headers -Body $bytes -ContentType "application/octet-stream" | Out-Null
                Write-Host "$fileName 上传成功 (attempt $attempt)"
                $uploaded = $true
                break
              } catch {
                Write-Host "上传 $fileName 失败 (attempt $attempt): $_"
                if ($attempt -lt $maxRetries) { Start-Sleep -Seconds 5 }
              }
            }
            if (-not $uploaded) {
              Write-Host "ERROR: $fileName 上传最终失败"
              exit 1
            }
          }
          Write-Host "=== Release 上传完成! ==="
          Write-Host "下载页面: https://github.com/$repo/releases/tag/$tagName"
