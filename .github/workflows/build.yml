name: 构建安装包

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab py7zr
          pip install PyMuPDF python-docx Pillow openpyxl ezdxf matplotlib

      - name: 验证依赖
        shell: pwsh
        run: |
          python -c "import fitz; print('PyMuPDF OK')"
          python -c "from docx import Document; print('python-docx OK')"
          python -c "from PIL import Image; print('Pillow OK')"
          python -c "import openpyxl; print('openpyxl OK')"
          python -c "import ezdxf; print('ezdxf OK')"
          python -c "import matplotlib; print('matplotlib OK')"

      - name: 解压标准数据库
        shell: pwsh
        run: python decompress_data.py

      - name: 转换标准数据库为 SQLite 格式
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING='utf-8'
          python convert_json_to_db.py

      - name: 下载 OCR 引擎 (PaddleOCR-json)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING='utf-8'
          python download_ocr.py

      - name: 构建可执行文件 (onedir 模式)
        shell: pwsh
        run: |
          python -m PyInstaller --onedir --windowed --name "LDAssistant" `
          --icon "app_icon.ico" `
          --add-data "standards.db;." `
          --add-data "ocr;ocr" `
          --add-data "app_icon.ico;." `
          --add-data "app_icon.png;." `
          --hidden-import "standard_db" `
          --hidden-import "docx.text" `
          --hidden-import "docx.document" `
          --hidden-import "docx.oxml" `
          --hidden-import "docx.oxml.ns" `
          --hidden-import "docx.oxml.table" `
          --hidden-import "docx.oxml.text.paragraph" `
          --hidden-import "docx.oxml.text.run" `
          --hidden-import "docx.oxml.section" `
          --hidden-import "docx.shared" `
          --hidden-import "docx.enum.text" `
          --hidden-import "docx.enum.style" `
          --hidden-import "docx.enum.section" `
          --hidden-import "docx.image" `
          --hidden-import "docx.image.bmp" `
          --hidden-import "docx.image.gif" `
          --hidden-import "docx.image.jpeg" `
          --hidden-import "docx.image.png" `
          --hidden-import "docx.image.tiff" `
          --hidden-import "openpyxl" `
          --hidden-import "openpyxl.styles" `
          --hidden-import "openpyxl.cell" `
          --hidden-import "openpyxl.worksheet" `
          --hidden-import "openpyxl.reader" `
          --hidden-import "openpyxl.reader.excel" `
          --hidden-import "openpyxl.writer" `
          --hidden-import "openpyxl.writer.excel" `
          --hidden-import "ezdxf" `
          --hidden-import "ezdxf.addons.drawing" `
          --hidden-import "ezdxf.addons.drawing.frontend" `
          --hidden-import "ezdxf.addons.drawing.matplotlib" `
          --hidden-import "ezdxf.addons.drawing.text" `
          --hidden-import "ezdxf.addons.drawing.properties" `
          --hidden-import "ezdxf.addons.drawing.type_hints" `
          --hidden-import "ezdxf.path" `
          --hidden-import "ezdxf.math" `
          --hidden-import "ezdxf.entities" `
          --hidden-import "matplotlib" `
          --hidden-import "matplotlib.backends" `
          --hidden-import "matplotlib.backends.backend_agg" `
          --hidden-import "matplotlib.font_manager" `
          --hidden-import "matplotlib.pyplot" `
          --hidden-import "PIL" `
          --hidden-import "PIL._tkinter_finder" `
          --hidden-import "PIL.ImageDraw" `
          --hidden-import "PIL.ImageFont" `
          --hidden-import "PIL.ImageFilter" `
          --hidden-import "PIL.ImageCms" `
          --hidden-import "PIL.ImageTk" `
          --hidden-import "PIL.ImageOps" `
          --hidden-import "PIL.ImageEnhance" `
          --hidden-import "PIL.ExifTags" `
          --hidden-import "PIL.TiffImagePlugin" `
          --hidden-import "PIL.JpegImagePlugin" `
          --hidden-import "PIL.PngImagePlugin" `
          --hidden-import "PIL.BmpImagePlugin" `
          --hidden-import "PIL.WebPImagePlugin" `
          --hidden-import "fitz" `
          --hidden-import "fitz.utils" `
          --collect-all "fitz" `
          --collect-all "PIL" `
          --collect-all "docx" `
          --collect-all "ezdxf" `
          --collect-all "matplotlib" `
          --collect-all "reportlab" `
          --hidden-import "reportlab" `
          --hidden-import "reportlab.pdfbase" `
          --hidden-import "reportlab.pdfbase.cidfonts" `
          --hidden-import "reportlab.pdfbase.ttfonts" `
          --hidden-import "reportlab.lib" `
          --hidden-import "reportlab.lib.pagesizes" `
          --hidden-import "reportlab.lib.styles" `
          --hidden-import "reportlab.lib.units" `
          --hidden-import "reportlab.lib.colors" `
          --hidden-import "reportlab.platypus" `
          --exclude-module "matplotlib.tests" `
          --exclude-module "numpy.testing" `
          --exclude-module "PIL.ImageShow" `
          --exclude-module "PIL.ImageGrab" `
          standard_checker_v2.py

      - name: 安装 Inno Setup 并编译安装包
        shell: pwsh
        run: |
          # 下载 Inno Setup 便携版（免安装）
          $innoUrl = "https://github.com/jrsoftware/innosetup/releases/download/innosetup-6.4.2/innosetup-6.4.2.exe"
          $innoExe = "$env:TEMP\innosetup.exe"
          Write-Host "下载 Inno Setup..."
          Invoke-WebRequest -Uri $innoUrl -OutFile $innoExe -UseBasicParsing
          # 解压到临时目录
          $innoDir = "$env:TEMP\innosetup"
          mkdir $innoDir -Force | Out-Null
          Write-Host "解压 Inno Setup..."
          Start-Process -FilePath $innoExe -ArgumentList "/VERYSILENT /DIR=$innoDir /NORESTART /NOICONS" -Wait -NoNewWindow
          $iscc = "$innoDir\ISCC.exe"
          Write-Host "ISCC: $iscc (exists: $(Test-Path $iscc))"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after extraction" }
          # 提取版本号
          $match = Select-String -Path "standard_checker_v2.py" -Pattern 'VERSION\s*=\s*"([\w.]+)"'
          if (-not $match) { throw "VERSION not found" }
          $version = $match.Matches.Groups[1].Value
          Write-Host "版本号: $version"
          # 编译安装包
          & $iscc /DAppVersion="$version" LDAssistant.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: 列出构建产物
        shell: pwsh
        run: |
          Write-Host "=== dist 目录内容 ==="
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse | Format-Table Name, Length, FullName
          } else {
            Write-Host "dist 目录不存在!"
            exit 1
          }
          Write-Host "=== 查找 LDAssistant-Setup-*.exe ==="
          $setupFiles = Get-ChildItem dist -Filter "LDAssistant-Setup-*.exe" -ErrorAction SilentlyContinue
          if ($setupFiles) {
            Write-Host "找到安装包:"
            $setupFiles | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
          } else {
            Write-Host "未找到 LDAssistant-Setup-*.exe 文件!"
            Write-Host "dist 下所有 .exe 文件:"
            Get-ChildItem dist -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

      - name: 上传安装包到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $apiUrl = "https://api.github.com/repos/$repo/releases"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          Write-Host "=== 删除旧 Release ==="
          try {
            $existing = Invoke-RestMethod -Uri "$apiUrl/tags/latest-build" -Headers $headers
            if ($existing) {
              Write-Host "删除旧 Release (id=$($existing.id))..."
              Invoke-RestMethod -Uri "$apiUrl/$($existing.id)" -Method DELETE -Headers $headers | Out-Null
            }
          } catch {
            Write-Host "无旧 Release 需要删除: $_"
          }

          Write-Host "=== 创建新 Release ==="
          $body = @{
            tag_name = "latest-build"
            name = "LDAssistant 最新构建"
            body = "自动构建最新版工程助手`ncommit: $($env:GITHUB_SHA)"
            draft = $false
            prerelease = $false
          } | ConvertTo-Json -Depth 5
          Write-Host "请求体: $body"

          $release = Invoke-RestMethod -Uri $apiUrl -Method POST -Headers $headers -Body $body -ContentType "application/json; charset=utf-8"
          Write-Host "Release 创建成功: id=$($release.id)"

          Write-Host "=== 上传安装包 ==="
          $setupFiles = Get-ChildItem dist -Filter "LDAssistant-Setup-*.exe"
          foreach ($file in $setupFiles) {
            $fileName = $file.Name
            $uploadUrl = $release.upload_url -replace '\{\?name,label\}', "?name=$fileName"
            Write-Host "上传 $fileName ..."
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            Invoke-RestMethod -Uri $uploadUrl -Method POST -Headers $headers -Body $bytes -ContentType "application/octet-stream"
            Write-Host "$fileName 上传成功"
          }
          Write-Host "=== Release 上传完成! ==="