name: 构建安装包

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab py7zr
          pip install PyMuPDF python-docx Pillow openpyxl ezdxf matplotlib

      - name: 验证依赖
        shell: pwsh
        run: |
          python -c "import fitz; print('PyMuPDF OK')"
          python -c "from docx import Document; print('python-docx OK')"
          python -c "from PIL import Image; print('Pillow OK')"
          python -c "import openpyxl; print('openpyxl OK')"
          python -c "import ezdxf; print('ezdxf OK')"
          python -c "import matplotlib; print('matplotlib OK')"

      - name: 解压标准数据库
        shell: pwsh
        run: python decompress_data.py

      - name: 转换标准数据库为 SQLite 格式
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING='utf-8'
          python convert_json_to_db.py

      - name: 下载 OCR 引擎 (PaddleOCR-json)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING='utf-8'
          python download_ocr.py

      - name: 构建可执行文件 (onedir 模式)
        shell: pwsh
        run: |
          python -m PyInstaller --onedir --windowed --name "LDAssistant" `
          --icon "app_icon.ico" `
          --add-data "standards.db;." `
          --add-data "ocr;ocr" `
          --add-data "app_icon.ico;." `
          --add-data "app_icon.png;." `
          --hidden-import "standard_db" `
          --hidden-import "docx.text" `
          --hidden-import "docx.document" `
          --hidden-import "docx.oxml" `
          --hidden-import "docx.oxml.ns" `
          --hidden-import "docx.oxml.table" `
          --hidden-import "docx.oxml.text.paragraph" `
          --hidden-import "docx.oxml.text.run" `
          --hidden-import "docx.oxml.section" `
          --hidden-import "docx.shared" `
          --hidden-import "docx.enum.text" `
          --hidden-import "docx.enum.style" `
          --hidden-import "docx.enum.section" `
          --hidden-import "docx.image" `
          --hidden-import "docx.image.bmp" `
          --hidden-import "docx.image.gif" `
          --hidden-import "docx.image.jpeg" `
          --hidden-import "docx.image.png" `
          --hidden-import "docx.image.tiff" `
          --hidden-import "openpyxl" `
          --hidden-import "openpyxl.styles" `
          --hidden-import "openpyxl.cell" `
          --hidden-import "openpyxl.worksheet" `
          --hidden-import "openpyxl.reader" `
          --hidden-import "openpyxl.reader.excel" `
          --hidden-import "openpyxl.writer" `
          --hidden-import "openpyxl.writer.excel" `
          --hidden-import "ezdxf" `
          --hidden-import "ezdxf.addons.drawing" `
          --hidden-import "ezdxf.addons.drawing.frontend" `
          --hidden-import "ezdxf.addons.drawing.matplotlib" `
          --hidden-import "ezdxf.addons.drawing.text" `
          --hidden-import "ezdxf.addons.drawing.properties" `
          --hidden-import "ezdxf.addons.drawing.type_hints" `
          --hidden-import "ezdxf.path" `
          --hidden-import "ezdxf.math" `
          --hidden-import "ezdxf.entities" `
          --hidden-import "matplotlib" `
          --hidden-import "matplotlib.backends" `
          --hidden-import "matplotlib.backends.backend_agg" `
          --hidden-import "matplotlib.font_manager" `
          --hidden-import "matplotlib.pyplot" `
          --hidden-import "PIL" `
          --hidden-import "PIL._tkinter_finder" `
          --hidden-import "PIL.ImageDraw" `
          --hidden-import "PIL.ImageFont" `
          --hidden-import "PIL.ImageFilter" `
          --hidden-import "PIL.ImageCms" `
          --hidden-import "PIL.ImageTk" `
          --hidden-import "PIL.ImageOps" `
          --hidden-import "PIL.ImageEnhance" `
          --hidden-import "PIL.ExifTags" `
          --hidden-import "PIL.TiffImagePlugin" `
          --hidden-import "PIL.JpegImagePlugin" `
          --hidden-import "PIL.PngImagePlugin" `
          --hidden-import "PIL.BmpImagePlugin" `
          --hidden-import "PIL.WebPImagePlugin" `
          --hidden-import "fitz" `
          --hidden-import "fitz.utils" `
          --collect-all "fitz" `
          --collect-all "PIL" `
          --collect-all "docx" `
          --collect-all "ezdxf" `
          --collect-all "matplotlib" `
          --collect-all "reportlab" `
          --hidden-import "reportlab" `
          --hidden-import "reportlab.pdfbase" `
          --hidden-import "reportlab.pdfbase.cidfonts" `
          --hidden-import "reportlab.pdfbase.ttfonts" `
          --hidden-import "reportlab.lib" `
          --hidden-import "reportlab.lib.pagesizes" `
          --hidden-import "reportlab.lib.styles" `
          --hidden-import "reportlab.lib.units" `
          --hidden-import "reportlab.lib.colors" `
          --hidden-import "reportlab.platypus" `
          --exclude-module "matplotlib.tests" `
          --exclude-module "numpy.testing" `
          --exclude-module "PIL.ImageShow" `
          --exclude-module "PIL.ImageGrab" `
          standard_checker_v2.py

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          Write-Host "=== 用 choco 安装 Inno Setup ==="
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          Write-Host "ISCC exists: $(Test-Path $iscc)"
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem "C:\Program Files*" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName; Write-Host "Found ISCC: $iscc" } else { throw "ISCC.exe not found" }
          }
          echo "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ISCC_PATH=$iscc"

      - name: 检查 ISS 依赖
        shell: pwsh
        run: |
          Write-Host "app_icon.ico exists: $(Test-Path app_icon.ico)"
          Write-Host "dist/LDAssistant exists: $(Test-Path dist/LDAssistant)"
          Write-Host "LDAssistant.iss exists: $(Test-Path LDAssistant.iss)"
          if (Test-Path dist/LDAssistant) {
            Write-Host "dist/LDAssistant 内容:"
            Get-ChildItem dist/LDAssistant | Format-Table Name, Length
            Write-Host "dist/LDAssistant 子目录:"
            Get-ChildItem dist/LDAssistant -Directory | ForEach-Object {
              Write-Host "  $($_.Name)/"
              Get-ChildItem $_.FullName | ForEach-Object { Write-Host "    $($_.Name)" }
            }
          } else {
            Write-Host "ERROR: dist/LDAssistant 不存在! PyInstaller 可能使用了不同的输出名"
            Write-Host "dist 目录内容:"
            if (Test-Path dist) {
              Get-ChildItem dist | Format-Table Name, Length
            }
          }

      - name: ISCC 编译安装包
        continue-on-error: true
        id: iscc
        shell: pwsh
        run: |
          $iscc = $env:ISCC_PATH
          Write-Host "ISCC: $iscc"
          $match = Select-String -Path "standard_checker_v2.py" -Pattern 'VERSION\s*=\s*"([\w.]+)"'
          if (-not $match) { throw "VERSION not found" }
          $version = $match.Matches.Groups[1].Value
          Write-Host "版本号: $version"
          Write-Host "=== ISCC 编译开始 ==="
          & $iscc /DAppVersion="$version" LDAssistant.iss 2>&1
          $isccExit = $LASTEXITCODE
          Write-Host "ISCC 退出码: $isccExit"
          if ($isccExit -eq 0) {
            Write-Host "=== ISCC 编译成功 ==="
            echo "iscc_success=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "=== ISCC 编译失败，将打包 onedir 作为备用 ==="
            echo "iscc_success=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: 打包 PyInstaller onedir 为 zip（备用方案）
        if: steps.iscc.outputs.iscc_success != 'true'
        shell: pwsh
        run: |
          Write-Host "=== ISCC 失败，打包 onedir 为 zip ==="
          $match = Select-String -Path "standard_checker_v2.py" -Pattern 'VERSION\s*=\s*"([\w.]+)"'
          $version = $match.Matches.Groups[1].Value
          $zipName = "LDAssistant-v$version.zip"
          Compress-Archive -Path "dist/LDAssistant/*" -DestinationPath "dist/$zipName" -Force
          Write-Host "已创建: dist/$zipName"
          Get-ChildItem "dist/$zipName" | Format-Table Name, Length

      - name: 上传构建产物为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDAssistant-build
          path: |
            dist/LDAssistant-Setup-*.exe
            dist/LDAssistant-*.zip
          if-no-files-found: warn
          retention-days: 7

      - name: 列出构建产物
        shell: pwsh
        run: |
          Write-Host "=== dist 目录内容 ==="
          if (Test-Path dist) {
            Get-ChildItem dist | Format-Table Name, Length, FullName
          } else {
            Write-Host "dist 目录不存在!"
          }

      - name: 上传到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $apiUrl = "https://api.github.com/repos/$repo/releases"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          # 查找要上传的文件（优先 Setup exe，其次 zip）
          $uploadFiles = @()
          $setupFiles = Get-ChildItem dist -Filter "LDAssistant-Setup-*.exe" -ErrorAction SilentlyContinue
          if ($setupFiles) {
            $uploadFiles += $setupFiles
            Write-Host "找到 ISCC 安装包:"
          } else {
            $zipFiles = Get-ChildItem dist -Filter "LDAssistant-*.zip" -ErrorAction SilentlyContinue
            if ($zipFiles) {
              $uploadFiles += $zipFiles
              Write-Host "找到 zip 包（ISCC 编译失败，使用备用方案）:"
            } else {
              Write-Host "ERROR: 未找到任何可上传的文件"
              exit 1
            }
          }
          $uploadFiles | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

          Write-Host "=== 删除旧 Release ==="
          try {
            $existing = Invoke-RestMethod -Uri "$apiUrl/tags/latest-build" -Headers $headers
            if ($existing) {
              Write-Host "删除旧 Release (id=$($existing.id))..."
              Invoke-RestMethod -Uri "$apiUrl/$($existing.id)" -Method DELETE -Headers $headers | Out-Null
            }
          } catch {
            Write-Host "无旧 Release 需要删除"
          }

          Write-Host "=== 创建新 Release ==="
          $body = @{
            tag_name = "latest-build"
            name = "LDAssistant 最新构建"
            body = "自动构建最新版工程助手`ncommit: $($env:GITHUB_SHA)"
            draft = $false
            prerelease = $false
          } | ConvertTo-Json -Depth 5

          try {
            $release = Invoke-RestMethod -Uri $apiUrl -Method POST -Headers $headers -Body $body -ContentType "application/json; charset=utf-8"
            Write-Host "Release 创建成功: id=$($release.id)"
          } catch {
            Write-Host "ERROR: 创建 Release 失败: $_"
            Write-Host "StatusCode: $($_.Exception.Response.StatusCode.value__)"
            $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
            $errorResponse = $reader.ReadToEnd()
            Write-Host "Response: $errorResponse"
            exit 1
          }

          Write-Host "=== 上传文件 ==="
          foreach ($file in $uploadFiles) {
            $fileName = $file.Name
            $uploadUrl = $release.upload_url -replace '\{\?name,label\}', "?name=$fileName"
            Write-Host "上传 $fileName ..."
            try {
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              Invoke-RestMethod -Uri $uploadUrl -Method POST -Headers $headers -Body $bytes -ContentType "application/octet-stream"
              Write-Host "$fileName 上传成功"
            } catch {
              Write-Host "ERROR: 上传 $fileName 失败: $_"
              exit 1
            }
          }
          Write-Host "=== Release 上传完成! ==="