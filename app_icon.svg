<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 白色安全帽主体 -->
  <g transform="translate(256,270)">
    <!-- 帽檐 -->
    <ellipse cx="0" cy="50" rx="148" ry="20" fill="#FFFFFF"/>
    <!-- 帽体 -->
    <path d="M-100,50 Q-105,-30 -80,-60 Q-40,-90 0,-95 Q40,-90 80,-60 Q105,-30 100,50 Z" fill="#FFFFFF"/>
    <!-- 帽顶脊线 -->
    <path d="M-30,-85 Q0,-92 30,-85" stroke="#E0E0E0" stroke-width="3" fill="none"/>
    <!-- 芯片 (浅蓝色) -->
    <rect x="-40" y="10" width="80" height="55" rx="6" fill="#64B5F6"/>
    <rect x="-32" y="18" width="64" height="39" rx="3" fill="#42A5F5"/>
    <!-- 芯片引脚 -->
    <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
      <line x1="-40" y1="20" x2="-48" y2="20"/>
      <line x1="-40" y1="35" x2="-48" y2="35"/>
      <line x1="-40" y1="50" x2="-48" y2="50"/>
      <line x1="40" y1="20" x2="48" y2="20"/>
      <line x1="40" y1="35" x2="48" y2="35"/>
      <line x1="40" y1="50" x2="48" y2="50"/>
      <line x1="-20" y1="65" x2="-20" y2="72"/>
      <line x1="0" y1="65" x2="0" y2="72"/>
      <line x1="20" y1="65" x2="20" y2="72"/>
    </g>
    <!-- 芯片内电路纹路 -->
    <g stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5" fill="none">
      <rect x="-20" y="24" width="40" height="27" rx="2"/>
      <line x1="-10" y1="30" x2="10" y2="30"/>
      <line x1="0" y1="30" x2="0" y2="45"/>
      <line x1="-10" y1="45" x2="10" y2="45"/>
    </g>
  </g>
</svg>